name: Actor corpus QA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 1"

concurrency:
  group: actor-corpus-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actor-corpus-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow

      - name: Actor QA unit tests
        run: python -m pytest tests/test_actor_compat_matrix.py tests/test_actor_render_qa.py -q

      - name: Manifest-driven actor corpus preflight
        run: |
          python tools/actor_corpus_regression.py \
            --manifest qa_corpus/actor_corpus_manifest.json \
            --no-render \
            --summary-only \
            --out debugCapture/actor_corpus_regression.json \
            --status-out debugCapture/actor_corpus_status.json

      - name: Upload actor QA status
        uses: actions/upload-artifact@v4
        with:
          name: actor-corpus-status
          path: |
            debugCapture/actor_corpus_regression.json
            debugCapture/actor_corpus_status.json
          if-no-files-found: error
          retention-days: 14
